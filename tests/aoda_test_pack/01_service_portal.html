<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Services Portal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 36px auto; padding: 0 20px; color: #243042; line-height: 1.5; }
    header, footer { padding: 16px 0; border-bottom: 1px solid #d7dee7; }
    footer { border-top: 1px solid #d7dee7; border-bottom: 0; margin-top: 32px; }
    label { display: block; margin: 12px 0 4px; }
    input { padding: 9px; width: 100%; max-width: 320px; }
    button { padding: 9px 16px; margin-top: 14px; cursor: pointer; }
    img { max-width: 100%; height: auto; }
    iframe { width: 100%; height: 140px; border: 1px solid #ccd5e0; }
  </style>
</head>
<body>
  <header>
    <h1>Community Services Portal</h1>
    <p>Find information about services in your community.</p>
  </header>

  <main>
    <h2>Featured program</h2>
    <img src="/images/community-centre.jpg" width="640" height="240">
    <p>Explore programs, facilities, and upcoming events.</p>

    <h2>Look up a service</h2>
    <form action="/search" method="get">
      <input id="service-search" name="query" type="search" placeholder="Type a service name">
      <button type="submit"></button>
    </form>

    <h2>Quick links</h2>
    <p><a href="/programs">Browse all programs</a></p>
    <p><a href="/help"></a></p>

    <h2>Location preview</h2>
    <iframe src="/maps/community-centre"></iframe>
  </main>

  <footer>
    <p>Community Services | Public information portal</p>
  </footer>
</body>
</html>
